<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/summitsafe-icon.svg" />
    <link rel="shortcut icon" href="/summitsafe-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Browser bars take the page background; the app retints them when its own theme setting differs. -->
    <meta name="theme-color" content="#f2f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)" />
    <!-- viewport-fit=cover lets the layout pad for the home indicator and notch with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      /* First paint, until the app applies its theme: no white flash in dark mode. */
      html:not([data-theme]) { background: #f2f3f1; color: #18201c; }
      body { margin: 0; }
      /* Until the bundle's styles load: the app icon over a quiet line, centred. */
      .loading-state {
        box-sizing: border-box; display: grid; place-items: center; align-content: center; gap: 16px;
        min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px 16px;
        font: 500 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #58615c;
      }
      .loading-state::before {
        content: ""; width: 52px; height: 52px; border-radius: 14px;
        background: url(/summitsafe-icon.svg) center / contain no-repeat;
        box-shadow: 0 10px 24px -10px rgba(8, 24, 16, 0.5);
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background: #0f1211; color: #eceeed; }
        .loading-state { color: #a3ada8; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .loading-state::before { animation: splash-breathe 1.6s ease-in-out infinite alternate; }
        @keyframes splash-breathe { from { opacity: 0.6; transform: scale(0.96); } }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..750&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    />
    <title>Backcountry Conditions — Mountain Planning Intelligence</title>
    <meta name="description" content="Plan backcountry trips with weather, avalanche, snowpack, air quality, terrain, and daylight signals synthesized into one time-aware conditions brief." />

    <!-- Open Graph -->
    <meta property="og:title" content="Backcountry Conditions" />
    <meta property="og:description" content="Weather, avalanche, snowpack, terrain, and daylight synthesized into one time-aware backcountry conditions brief." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:site_name" content="Backcountry Conditions" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Backcountry Conditions" />
    <meta name="twitter:description" content="Weather, avalanche, snowpack, terrain, and daylight synthesized into one time-aware backcountry conditions brief." />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
