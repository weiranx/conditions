name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below have inputs that changed (scripts/ci-changed-areas.sh).
  # A job skipped by its `if` counts as passed, so CI still succeeds and deploys.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to find the last main commit whose CI passed
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      mcp: ${{ steps.areas.outputs.mcp }}
      pipeline: ${{ steps.areas.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Commits and trees only: enough to diff against any earlier commit.
          fetch-depth: 0
          filter: blob:none

      - name: Find the commit to compare against
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The checkout is GitHub's test merge; its first parent is the base branch.
            base="$(git rev-parse HEAD^1)"
          else
            # The last main commit whose CI passed, so a cancelled or failed
            # run's changes are tested again by the next push.
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')" || base=""
          fi
          echo "==> Comparing against ${base:-nothing}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas
        id: areas
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: scripts/ci-changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  pipeline-checks:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Validate workflows and deployment scripts
        run: |
          actionlint -color
          scripts=(scripts/deploy.sh scripts/ci-deploy.sh scripts/ci-changed-areas.sh scripts/setup-nginx.sh scripts/provision.sh scripts/provision-server.sh)
          for script in "${scripts[@]}"; do bash -n "$script"; done
          shellcheck "${scripts[@]}"

      - name: Deployment regression tests
        run: node --test scripts/tests/*.test.mjs

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: UI component tests
        run: npm run test:ui

      - name: Mock API tests
        run: npm run test:mock

      - name: Build
        run: npm run build

  mcp-tests:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            backend/package-lock.json

      - name: MCP tests
        run: npm ci --prefix mcp && npm test --prefix mcp

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Persistent OAuth isolation and rotation tests
        env:
          MCP_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/postgres
        run: node --test backend/test/integration.mcp-oauth.cjs
