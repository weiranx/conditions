name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Run backend tests as a deploy gate. The deploy job only runs if these pass.
  # Tests are run inline (rather than depending on ci.yml) because GitHub Actions
  # does not natively support cross-workflow job dependencies.
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/summitsafe

            # Pull, build, migrate, recreate, and verify through the same
            # locked deployment path used for manual VPS releases. The CI user
            # does not manage host nginx, so that privileged step is skipped.
            ./scripts/deploy.sh --no-nginx
