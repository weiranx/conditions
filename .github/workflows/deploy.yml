name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  # CI may be superseded, but an active release must finish migrations/restart.
  cancel-in-progress: false

jobs:
  backend:
    # workflow_run also fires for failed/cancelled CI and can receive PR runs.
    # Only successful pushes to this repository's main may use deploy secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy tested commit to VPS
        id: ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Pins the droplet's SSH host key when set (output of
          # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`, SHA256:...).
          # Left unset, the action skips host verification.
          fingerprint: ${{ secrets.DO_SSH_FINGERPRINT }}
          version: 1.8.4 # ssh-action adds the release tag's v prefix.
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_SHA
          # Send the tested bootstrap from the runner, including on the first
          # release when the VPS still has the previous deployment script.
          script_path: scripts/ci-deploy.sh
          capture_stdout: true

      # ci-deploy.sh exits 0 without releasing when main has moved past this
      # commit. The frontend follows this one decision, so production never
      # pairs this backend with an older frontend or the reverse.
      - name: Record whether the backend released this commit
        id: release
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_OUTPUT: ${{ steps.ssh.outputs.stdout }}
        run: |
          if grep -qF "==> Releasing tested commit $DEPLOY_SHA" <<< "$DEPLOY_OUTPUT"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> Backend skipped $DEPLOY_SHA; skipping the frontend too."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Cloudflare Pages' automatic production deployments must stay disabled
  # (Settings → Build → Branch control) so the frontend, like the backend,
  # ships only commits whose complete CI run passed.
  frontend:
    needs: backend
    if: needs.backend.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          # Commits and trees only: enough to diff against the live deployment.
          fetch-depth: 0
          filter: blob:none

      # Compares with the commit of the live production deployment rather than
      # the previous push, so a frontend change whose release failed or was
      # skipped still ships with the next release. Any doubt deploys.
      - name: Check whether frontend/ changed since the live deployment
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'conditions' }}
        run: |
          live="$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty')" || live=""
          # The job runs in frontend/, so `.` is frontend/.
          if [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$live^{commit}" 2>/dev/null \
            && git diff --quiet "$live" HEAD -- .; then
            echo "==> The live frontend ($live) already matches frontend/; skipping the build."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "==> Deploying the frontend (live commit: ${live:-unknown})."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.live.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        if: steps.live.outputs.deploy == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_URL || 'https://apivps.conditions.weiranxiong.com' }}
        run: npm ci && npm run build

      - name: Deploy tested commit to Cloudflare Pages
        if: steps.live.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'conditions' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          npx --yes wrangler@4.139.0 pages deploy dist
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "$DEPLOY_SHA" --commit-dirty=false

  smoke-test:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Checks the release the way users reach it: DNS, TLS, nginx, CORS, the
      # backend with PostgreSQL, one end-to-end report, MCP and the frontend.
      # Repository variables override the production origins.
      - name: Smoke test production
        env:
          SMOKE_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://apivps.conditions.weiranxiong.com' }}
          SMOKE_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://conditions.weiranxiong.com' }}
        run: node scripts/smoke-test.mjs
