name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  # CI may be superseded, but an active release must finish migrations/restart.
  cancel-in-progress: false

jobs:
  backend:
    # workflow_run also fires for failed/cancelled CI and can receive PR runs.
    # Only successful pushes to this repository's main may use deploy secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy tested commit to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Pins the droplet's SSH host key when set (output of
          # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`, SHA256:...).
          # Left unset, the action skips host verification.
          fingerprint: ${{ secrets.DO_SSH_FINGERPRINT }}
          version: 1.8.4 # ssh-action adds the release tag's v prefix.
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_SHA
          # Send the tested bootstrap from the runner, including on the first
          # release when the VPS still has the previous deployment script.
          script_path: scripts/ci-deploy.sh

  # Cloudflare Pages' automatic production deployments must stay disabled
  # (Settings → Build → Branch control) so the frontend, like the backend,
  # ships only commits whose complete CI run passed.
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Like ci-deploy.sh: an older CI run finishing late must not roll the
      # frontend back past a newer commit, which has its own CI run.
      - name: Skip superseded commit
        id: current
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          remote_head="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          if [ "$remote_head" = "$DEPLOY_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> Skipping superseded commit $DEPLOY_SHA; main is $remote_head."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        if: steps.current.outputs.deploy == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_URL || 'https://apivps.conditions.weiranxiong.com' }}
        run: npm ci && npm run build

      - name: Deploy tested commit to Cloudflare Pages
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'conditions' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          npx --yes wrangler@4.139.0 pages deploy dist
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "$DEPLOY_SHA" --commit-dirty=false

  smoke-test:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Checks the release the way users reach it: DNS, TLS, nginx, CORS, the
      # backend with PostgreSQL, one end-to-end report, MCP and the frontend.
      # Repository variables override the production origins.
      - name: Smoke test production
        env:
          SMOKE_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://apivps.conditions.weiranxiong.com' }}
          SMOKE_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://conditions.weiranxiong.com' }}
        run: node scripts/smoke-test.mjs
