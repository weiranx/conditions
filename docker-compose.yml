name: summitsafe

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: summitsafe-backend:latest
    container_name: summitsafe-backend
    restart: unless-stopped
    # Bind to localhost only — host nginx proxies to this port; internet can't reach it directly.
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      # Lives at /opt/summitsafe/.env on the VPS — not committed to git.
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      # Named volume — initialized from the image's /app/data dir (owned by appuser).
      # Bind mounts would be owned by root on the host, causing EACCES for appuser.
      - report-logs-data:/app/data
    # 15s gives the existing 10s graceful-shutdown handler room to complete
    # before Docker sends SIGKILL.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:17-alpine
    container_name: summitsafe-postgres
    restart: unless-stopped
    # PostgreSQL is intentionally not published on a host port. The backend
    # reaches it as `postgres:5432` over Docker's private project network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-summitsafe}
      POSTGRES_USER: ${POSTGRES_USER:-summitsafe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  report-logs-data:
  postgres-data:
